# Publishes qrdx, @qrdx/cli and @qrdx/n8n-nodes-qrdx to npm from main with
# npm Trusted Publishing (OIDC). No npm token is stored anywhere: npm
# exchanges this run's GitHub OIDC token for a short-lived publish token and
# attaches a provenance statement on its own.
#
# The n8n nodes publish in their own job, so a problem there (no trusted
# publisher yet, say) never stops qrdx or @qrdx/cli. Re-run the workflow by
# hand once it's fixed: versions already on npm are skipped.
#
# One-time setup on npmjs.com, for each of qrdx, @qrdx/cli and
# @qrdx/n8n-nodes-qrdx:
#   Package → Settings → Trusted publishing → GitHub Actions
#     Organization or user: bucharitesh
#     Repository:           qrdx
#     Workflow filename:    publish.yml
#     Environment:          (leave empty)
#     Allowed actions:      npm publish
#
# Trusted publishing needs npm 11.5.1+ on Node 22.14+, so the job installs a
# pinned npm 11. pnpm packs each package, which turns the CLI's
# "qrdx": "workspace:*" into the exact qrdx version; npm then uploads the
# tarball. Publishing a tarball skips the packages' prepublishOnly scripts,
# so this job runs the same checks itself: build, tests and the README
# option lists.
#
# A package is published only when the version in its package.json is not
# on npm yet, so a push that doesn't bump a version publishes nothing. qrdx
# goes first because the CLI depends on it.
name: Publish

on:
  push:
    branches:
      - main
    paths:
      - packages/qrdx/**
      - packages/cli/**
      - plugins/n8n/**
  workflow_dispatch:

# Never cancel a publish halfway; queue the next one instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Trusted publishing (OIDC) and provenance.
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  publish:
    name: Publish to npm
    # Manual runs publish only from main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Uses the version pinned in package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # No dependency cache: npm recommends release builds start clean.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@11.21.1
          echo "node $(node --version), npm $(npm --version)"

      # Only a 404 from npm means "not published yet"; any other npm error
      # (network, auth) stops the run instead of guessing.
      - name: Find unpublished versions
        id: versions
        run: |
          any=false
          for dir in qrdx cli; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if output="$(npm view "$name@$version" version 2>&1)"; then
              published="$output"
            elif printf '%s' "$output" | grep -q E404; then
              published=""
            else
              echo "::error::Could not check $name@$version on npm: $output"
              exit 1
            fi
            if [ "$published" = "$version" ]; then
              echo "$name@$version is already on npm, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$dir=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name@$version will be published." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$dir=true" >> "$GITHUB_OUTPUT"
              any=true
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.versions.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      # The CLI and its tests consume qrdx from its dist/ output.
      - name: Build
        if: steps.versions.outputs.any == 'true'
        run: pnpm turbo build --filter=qrdx --filter=@qrdx/cli

      - name: Test
        if: steps.versions.outputs.any == 'true'
        run: pnpm turbo test --filter=qrdx --filter=@qrdx/cli

      # The check both packages' prepublishOnly scripts run: the option
      # lists in the qrdx and @qrdx/cli READMEs match the code.
      - name: Check README option lists
        if: steps.versions.outputs.any == 'true'
        run: node packages/qrdx/scripts/readme-catalogue.mjs --check

      - name: Pack
        if: steps.versions.outputs.any == 'true'
        id: pack
        run: |
          dest="$RUNNER_TEMP/npm-packs"
          mkdir -p "$dest"
          for dir in qrdx cli; do
            (cd "packages/$dir" && pnpm pack --pack-destination "$dest" > /dev/null)
          done
          qrdx="$(ls "$dest"/qrdx-[0-9]*.tgz)"
          cli="$(ls "$dest"/qrdx-cli-[0-9]*.tgz)"
          echo "qrdx=$qrdx" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          # The packed CLI must depend on a real qrdx version, never workspace:.
          dep="$(tar -xOzf "$cli" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).dependencies.qrdx")"
          echo "@qrdx/cli depends on qrdx $dep" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$dep" in
            workspace:*|undefined|"") echo "::error::The packed @qrdx/cli still has qrdx \"$dep\"."; exit 1 ;;
          esac

      - name: Publish qrdx
        if: steps.versions.outputs.qrdx == 'true'
        run: npm publish "${{ steps.pack.outputs.qrdx }}" --access public --provenance

      - name: Publish @qrdx/cli
        if: steps.versions.outputs.cli == 'true'
        run: npm publish "${{ steps.pack.outputs.cli }}" --access public --provenance

  publish-n8n:
    name: Publish @qrdx/n8n-nodes-qrdx to npm
    # Manual runs publish only from main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm 11 (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@11.21.1
          echo "node $(node --version), npm $(npm --version)"

      - name: Find whether this version is published
        id: version
        run: |
          name="$(node -p "require('./plugins/n8n/package.json').name")"
          version="$(node -p "require('./plugins/n8n/package.json').version")"
          if output="$(npm view "$name@$version" version 2>&1)"; then
            published="$output"
          elif printf '%s' "$output" | grep -q E404; then
            published=""
          else
            echo "::error::Could not check $name@$version on npm: $output"
            exit 1
          fi
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version will be published." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # What the package's prepublishOnly runs (a packed tarball skips it).
      - name: Build, lint and test
        if: steps.version.outputs.publish == 'true'
        run: |
          pnpm --filter @qrdx/n8n-nodes-qrdx build
          pnpm --filter @qrdx/n8n-nodes-qrdx test

      - name: Pack
        if: steps.version.outputs.publish == 'true'
        id: pack
        run: |
          dest="$RUNNER_TEMP/npm-packs"
          mkdir -p "$dest"
          (cd plugins/n8n && pnpm pack --pack-destination "$dest" > /dev/null)
          echo "tarball=$(ls "$dest"/qrdx-n8n-nodes-qrdx-[0-9]*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Publish @qrdx/n8n-nodes-qrdx
        if: steps.version.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
