# Publishes server.json to the official MCP Registry as dev.qrdx/qrdx when it
# changes on main. A version that's already in the registry is skipped, so a
# push that doesn't bump "version" publishes nothing.
#
# The registry trusts the name through DNS: the qrdx.dev apex holds a TXT
# record "v=MCPv1; k=ed25519; p=<public key>", and the matching Ed25519
# private key, in hex, is the repository secret MCP_REGISTRY_PRIVATE_KEY.
# Without the secret the job prints a notice and stops. To make a key pair,
# see docs/modelcontextprotocol-io/authentication.mdx in
# github.com/modelcontextprotocol/registry ("DNS Authentication"); when you
# rotate it, remove the old TXT record too.
name: MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - server.json
  workflow_dispatch:

# Never cancel a publish halfway; queue the next one instead.
concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the MCP Registry
    # Manual runs publish only from main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      # Pinned release, checked against the sha256 in the release's
      # registry_<version>_checksums.txt.
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the key and the registry
        id: check
        env:
          HAS_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::MCP_REGISTRY_PRIVATE_KEY isn't set in $GITHUB_REPOSITORY, so nothing was published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          # The API takes the name as one path segment: dev.qrdx%2Fqrdx.
          encoded="$(jq -rn --arg name "$name" '$name | @uri')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$encoded/versions/$version")"
          case "$status" in
            200)
              echo "::notice::$name $version is already in the registry, so nothing was published."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::The registry answered $status when asked for $name $version."
              exit 1
              ;;
          esac

      - name: Download mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Log in with the qrdx.dev DNS key
        if: steps.check.outputs.publish == 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain qrdx.dev --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher publish
