name: Frame scan

# The full scan sweep over every official frame (packages/qrdx/src/frames/
# official). Pull request CI scans a sample (the hand-made frames, one frame
# per layout and a rotating set, packages/qrdx/scripts/official-frames/
# sample.mjs), which keeps it inside its time limit; this runs every frame
# through the engine's scan checks and the community publish gate:
# - on each release (a push to main that changes the frames),
# - weekly, and
# - by hand (Actions > Frame scan > Run workflow).
# The frames are split across the parallel jobs below: part i of n checks
# every n-th frame (QRDX_FRAME_SCAN_PART, sample.mjs), so together they
# check every one. With 1,013 frames a single job took over 25 minutes, and
# the gate, then one test for all its frames, ran past its 5-minute limit
# (13 Nov 2026). Add a part when the library grows.
# It runs on GitHub's runners only; nothing here runs on Vercel.
on:
  push:
    branches:
      - main
    paths:
      - packages/qrdx/src/frames/**
      - packages/qrdx/scripts/official-frames/**
      - packages/qrdx/src/frame*.ts
      - packages/qrdx/src/frame*.tsx
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: frame-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders so env validation passes in the app's tests. Nothing in
  # this workflow connects to a database or any external service.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  QRDX_FULL_FRAME_SCAN: 1

jobs:
  scan:
    name: Scan the official frames (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every part runs to the end, so a run lists every frame that fails
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      QRDX_FRAME_SCAN_PART: ${{ matrix.part }}/${{ strategy.job-total }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # zbar reads every frame too, as it does on a developer's machine.
      - name: Install zbar
        run: sudo apt-get update && sudo apt-get install -y zbar-tools

      - name: Build qrdx
        run: bun run --filter qrdx build:inplace

      - name: Engine scan checks, this part's frames
        working-directory: packages/qrdx
        run: bun x vitest run tests/official-frames tests/frame-label-markers.test.ts

      - name: Publish gate, this part's seeded frames
        working-directory: apps/app
        run: |
          bun x next typegen
          bun x vitest run tests/database/seed-frames-gate-1.test.ts tests/database/seed-frames-gate-2.test.ts tests/database/seed-frames-gate-3.test.ts
