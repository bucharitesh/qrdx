name: CI

# One run per pull request (its required check) and one per push to main,
# so the exact code that ships is tested even when a release PR is merged
# before its checks finish. Pushes to staging don't run CI: every change
# reaches staging through a pull request that already ran it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders so env validation passes during type generation and tests.
  # Nothing in this workflow connects to a database or any external service.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Branch protection requires this exact check name on every pull request.
  check:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An explicit bash shell runs with -eo pipefail, so a failing command
    # piped into tee still fails its step.
    defaults:
      run:
        shell: bash
    steps:
      # Full history, so turbo --affected can compare with the PR's base.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Uses the version pinned in package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Turbo's local cache (builds, typechecks, test logs). A task whose
      # inputs haven't changed since a cached run replays its result instead
      # of running again. Runs on main save caches every pull request can
      # read; each run saves its own entry under its commit.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The docs app, CLI and CLI tests consume qrdx from its dist/ output,
      # and the CLI tests run the CLI's own dist/index.js.
      - name: Build qrdx and the CLI
        run: pnpm turbo build --filter=qrdx --filter=@qrdx/cli 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"

      - name: Typecheck packages
        run: pnpm typecheck 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"

      - name: Typecheck docs app
        run: |
          pnpm --filter docs exec next typegen
          pnpm typecheck:docs

      # Pull requests into staging test the packages they change and the
      # packages that depend on them. Release pull requests into main, pushes
      # to main and manual runs test everything. Branch protection requires
      # this job on every pull request; it passes when nothing is affected.
      - name: Test
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AFFECTED: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: |
          set -o pipefail
          if [ "$AFFECTED" = "true" ]; then
            echo "Testing the packages this PR changes against $TURBO_SCM_BASE, and their dependents." | tee -a "$GITHUB_STEP_SUMMARY"
            pnpm turbo test --affected 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
          else
            echo "Testing every package." | tee -a "$GITHUB_STEP_SUMMARY"
            pnpm turbo test 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
          fi

      # Shows what came from the cache, so a pass that only replayed cached
      # results is visible.
      - name: Turbo cache report
        if: always()
        run: |
          log="$RUNNER_TEMP/turbo.log"
          [ -f "$log" ] || exit 0
          hits="$(grep -c 'cache hit' "$log" || true)"
          misses="$(grep -c 'cache miss' "$log" || true)"
          {
            echo "### Turbo cache"
            echo "Replayed from cache: $hits task(s). Ran: $misses task(s)."
            echo
            echo '```'
            grep -E 'cache (hit|miss)' "$log" | sed -E 's/\x1b\[[0-9;]*m//g' | sed -E 's/^[[:space:]]*//' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Biome is a devDependency of apps/docs; run it over the whole repo.
      - name: Lint (Biome)
        run: ./apps/docs/node_modules/.bin/biome ci .
