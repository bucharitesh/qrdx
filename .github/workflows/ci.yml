name: CI

# One run per pull request (its required check) and one per push to staging
# and to main. Pull requests into staging test only what they change. Pushes
# to staging test everything in the background after each merge, so by the
# time staging is released the full suite has usually passed on that exact
# code. A release pull request (staging -> main) and the push to main it
# creates then reuse that result instead of testing the same tree again
# (scripts/ci-reuse-check.sh); if the staging run is still going they wait
# for it, and if nothing matches they run the full suite as before.
on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets scripts/ci-reuse-check.sh look up earlier runs of this workflow.
  actions: read

env:
  # Placeholders so env validation passes during type generation and tests.
  # Nothing in this workflow connects to a database or any external service.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Branch protection requires this exact check name on every pull request.
  check:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    # The full suite took 17.8 and 18.9 minutes on 2026-11-10, with the Test
    # step at 15.5 and 16.7. A release run can first wait up to 20 minutes
    # for a staging run of the same code, so 45 still guards against a hung
    # job without cancelling a healthy one.
    timeout-minutes: 45
    # An explicit bash shell runs with -eo pipefail, so a failing command
    # piped into tee still fails its step.
    defaults:
      run:
        shell: bash
    steps:
      # Full history, so turbo --affected can compare with the PR's base.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Skips everything below when a full run of this exact tree already
      # passed (see the note at the top). Manual runs always test everything.
      - name: Reuse an earlier run of the same code
        id: reuse
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Release pull requests and pushes to main wait for a staging run
          # of the same code that's still going; other runs only take a
          # finished one.
          CI_REUSE_WAIT_SECONDS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')) && '1200' || '0' }}
        run: bash scripts/ci-reuse-check.sh

      # Bun installs the dependencies (the version pinned in package.json
      # "packageManager"); Node 22 runs the builds, tests and tools.
      - name: Setup Bun
        if: steps.reuse.outputs.hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Bun cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Turbo's local cache (builds, typechecks, test logs). A task whose
      # inputs haven't changed since a cached run replays its result instead
      # of running again. Runs on main save caches every pull request can
      # read; each run saves its own entry under its commit.
      - name: Restore turbo cache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        if: steps.reuse.outputs.hit != 'true'
        run: bun install --frozen-lockfile

      # The main app, CLI and CLI tests consume qrdx from its dist/ output,
      # and the CLI tests run the CLI's own dist/index.js.
      - name: Build qrdx and the CLI
        if: steps.reuse.outputs.hit != 'true'
        run: bun x turbo build --filter=qrdx --filter=@qrdx/cli 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"

      - name: Typecheck packages
        if: steps.reuse.outputs.hit != 'true'
        run: bun run typecheck 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"

      - name: Typecheck the main app
        if: steps.reuse.outputs.hit != 'true'
        run: |
          (cd apps/app && bun x next typegen)
          bun run typecheck:app

      # Every translated catalog against English: keys, ICU arguments, numbers,
      # review status (apps/app/scripts/i18n-check.ts).
      - name: Check translations
        if: steps.reuse.outputs.hit != 'true'
        run: bun run --filter app i18n:check

      # Pull requests into staging test the packages they change and the
      # packages that depend on them. Release pull requests into main, pushes
      # to main and manual runs test everything. Branch protection requires
      # this job on every pull request; it passes when nothing is affected.
      - name: Test
        if: steps.reuse.outputs.hit != 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          AFFECTED: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: |
          set -o pipefail
          if [ "$AFFECTED" = "true" ]; then
            echo "Testing the packages this PR changes against $TURBO_SCM_BASE, and their dependents." | tee -a "$GITHUB_STEP_SUMMARY"
            bun x turbo test --affected 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
            # The main app's tests check its behaviour against the docs'
            # pages (apps/docs/content), which aren't its files, so
            # --affected leaves it out when only the pages change.
            if ! git diff --quiet "$TURBO_SCM_BASE"...HEAD -- apps/docs/content; then
              echo "The docs' pages changed: testing the main app against them too." | tee -a "$GITHUB_STEP_SUMMARY"
              bun x turbo test --filter=app 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
            fi
          else
            echo "Testing every package." | tee -a "$GITHUB_STEP_SUMMARY"
            bun x turbo test 2>&1 | tee -a "$RUNNER_TEMP/turbo.log"
          fi

      # Shows what came from the cache, so a pass that only replayed cached
      # results is visible.
      - name: Turbo cache report
        if: always() && steps.reuse.outputs.hit != 'true'
        run: |
          log="$RUNNER_TEMP/turbo.log"
          [ -f "$log" ] || exit 0
          hits="$(grep -c 'cache hit' "$log" || true)"
          misses="$(grep -c 'cache miss' "$log" || true)"
          {
            echo "### Turbo cache"
            echo "Replayed from cache: $hits task(s). Ran: $misses task(s)."
            echo
            echo '```'
            grep -E 'cache (hit|miss)' "$log" | sed -E 's/\x1b\[[0-9;]*m//g' | sed -E 's/^[[:space:]]*//' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Ultracite runs Biome (biome.jsonc) over the whole repo; findings show
      # as annotations on the pull request.
      - name: Lint (Ultracite)
        if: steps.reuse.outputs.hit != 'true'
        run: bun run lint:ci --reporter=github
