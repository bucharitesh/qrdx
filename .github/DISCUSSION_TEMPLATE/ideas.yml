body:
  - type: markdown
    attributes:
      value: |
        Ideas is for talking a suggestion through before anyone builds it: what problem it solves, who else has it and what it could look like. Search [existing ideas](https://github.com/bucharitesh/qrdx/discussions/categories/ideas) first, and upvote one that matches instead of starting a new thread.

        If you already know exactly what you want, a [feature request](https://github.com/bucharitesh/qrdx/issues/new?template=feature_request.yml) works too.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of QRdx would it change? Pick the closest match.
      options:
        - Playground (editor, styles, art, AI chat, downloads)
        - Dynamic codes, short links, custom domains and analytics
        - Hosted pages and forms
        - Dashboard, workspaces and account settings
        - REST API (api.qrdx.dev/v1)
        - Image API (api.qrdx.dev/v1/qr)
        - MCP server (mcp.qrdx.dev/mcp)
        - React library (qrdx on npm)
        - CLI (@qrdx/cli)
        - Chrome extension
        - Figma plugin
        - Raycast extension
        - Canva app
        - Integrations
        - Community (shared frames and themes)
        - Free tools (bulk generator, scan checker, print size, scanner)
        - Self-hosting and Docker
        - Docs
        - Something else or not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How could QRdx help? Sketches, screenshots of other tools and rough API shapes are all welcome.
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything you're unsure about, or trade-offs you'd like other people's views on.
